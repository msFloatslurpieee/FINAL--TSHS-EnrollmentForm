<!DOCTYPE html>
<html>
<head>
    <title>Taytay Senior High School - Digital Enrollment</title>
    <style>
        * { 
            box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; 
        }
        body {
            background: linear-gradient(rgba(13, 71, 161, 0.45), rgba(13, 71, 161, 0.45)), 
                        url('your-background.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #e3f2fd;
            min-height: 100vh;
            padding: 30px;
        }
        .container {
            width: 90%; max-width: 900px; margin: auto;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 15px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1976d2, #0d47a1);
            color: white; text-align: center; padding: 30px 20px;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { font-size: 15px; opacity: 0.9; }
        .form-container { padding: 30px; }
        .section-title {
            color: #1565c0; border-bottom: 2px solid #1565c0;
            padding-bottom: 8px; margin-bottom: 20px; margin-top: 10px;
        }
        .row { display: flex; gap: 20px; margin-bottom: 18px; }
        .input-group { flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 7px; color: #333; }
        input, select, textarea {
            width: 100%; padding: 12px; border: 1px solid #bbb;
            border-radius: 8px; font-size: 14px; outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #1565c0; box-shadow: 0 0 6px rgba(21, 101, 192, 0.35);
        }
        textarea { resize: vertical; min-height: 80px; }
        .buttons { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
        button {
            border: none; padding: 13px 25px; border-radius: 8px;
            font-size: 15px; font-weight: bold; cursor: pointer;
        }
        .submit-btn { background: #1565c0; color: white; }
        .submit-btn:hover { background: #0d47a1; }
        .clear-btn { background: #e0e0e0; color: #333; }
        .clear-btn:hover { background: #bdbdbd; }
        .required { color: #d32f2f; }
        @media (max-width: 700px) {
            body { padding: 10px; }
            .row { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Taytay Senior High School</h1>
        <p>Digital Enrollment Form — Step 1 of 2</p>
    </div>

    <div class="form-container">
        <form id="enrollmentForm">
            <h2 class="section-title">Student Information</h2>
            <div class="row">
                <div class="input-group">
                    <label>First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" placeholder="Enter first name" required>
                </div>
                <div class="input-group">
                    <label>Middle Name</label>
                    <input type="text" id="middleName" placeholder="Enter middle name">
                </div>
                <div class="input-group">
                    <label>Last Name <span class="required">*</span></label>
                    <input type="text" id="lastName" placeholder="Enter last name" required>
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Date of Birth <span class="required">*</span></label>
                    <input type="date" id="birthDate" required>
                </div>
                <div class="input-group">
                    <label>Sex <span class="required">*</span></label>
                    <select id="sex" required>
                        <option value="">Select</option>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Grade Level <span class="required">*</span></label>
                    <select id="grade" required>
                        <option value="">Select Grade Level</option>
                        <option>Grade 11</option>
                        <option>Grade 12</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Strand <span class="required">*</span></label>
                    <select id="strand" required>
                        <option value="">Select Strand</option>
                        <option value="TVL">TVL (ICT, CULINARY, SMAW)</option>
                        <option value="ABM">ABM</option>
                        <option value="HUMSS">HUMSS</option>
                        <option value="STEM">STEM</option>
                    </select>
                </div>
            </div>

            <h2 class="section-title">Contact Information</h2>
            <div class="row">
                <div class="input-group">
                    <label>Contact Number <span class="required">*</span></label>
                    <input type="tel" id="contact" placeholder="09XXXXXXXXX" maxlength="11" required>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="example@gmail.com">
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Complete Address <span class="required">*</span></label>
                    <textarea id="address" placeholder="Enter complete address" required></textarea>
                </div>
            </div>

            <h2 class="section-title">Parent / Guardian Information</h2>
            <div class="row">
                <div class="input-group">
                    <label>Parent / Guardian Name <span class="required">*</span></label>
                    <input type="text" id="guardianName" placeholder="Enter full name" required>
                </div>
                <div class="input-group">
                    <label>Guardian Contact Number <span class="required">*</span></label>
                    <input type="tel" id="guardianContact" placeholder="09XXXXXXXXX" maxlength="11" required>
                </div>
            </div>

            <div class="buttons">
                <button type="submit" class="submit-btn">Review Enrollment &rarr;</button>
                <button type="button" class="clear-btn" onclick="clearForm()">Clear Form</button>
            </div>
        </form>
    </div>
</div>

<script>
    const fieldIds = [
        'firstName', 'middleName', 'lastName', 'birthDate', 'sex',
        'grade', 'strand', 'contact', 'email', 'address',
        'guardianName', 'guardianContact'
    ];

    window.addEventListener('DOMContentLoaded', () => {
        const savedDraft = JSON.parse(sessionStorage.getItem('draftEnrollment'));
        if (savedDraft) {
            fieldIds.forEach(id => {
                if (savedDraft[id]) document.getElementById(id).value = savedDraft[id];
            });
        }
    });

    document.getElementById('enrollmentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = {};
        fieldIds.forEach(id => formData[id] = document.getElementById(id).value.trim());
        sessionStorage.setItem('draftEnrollment', JSON.stringify(formData));
        window.location.href = 'review.html';
    });

    function clearForm() {
        document.getElementById('enrollmentForm').reset();
        sessionStorage.removeItem('draftEnrollment');
    }
</script>
</body>
</html>
